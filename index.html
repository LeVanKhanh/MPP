<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Planet</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Optional: Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-container">
                <i class="fas fa-globe"></i>
                <h1 class="logo">My Personal Planet </h1>
                <span class="ai-badge" title="This book was written with the support of AI as a thinking companion. The reflections, choices, and responsibility for the ideas remain entirely mine.">AI</span>
            </div>
            <div class="header-controls">
                <button id="settings-toggle" class="settings-toggle" type="button" aria-haspopup="dialog" aria-controls="settings-dialog" aria-label="Settings" title="Settings">
                    <i class="fas fa-sliders-h" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>
    <div class="container">
        <nav id="sidebar" class="sidebar" aria-label="Primary">
            <div class="menu-header" aria-label="Menu header">
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <a class="menu-home" role="menuitem" href="#/home" data-route="pages/the-planet/about/about.html">
                    <i class="fas fa-home" aria-hidden="true"></i>
                    <span>Home</span>
                </a>
                <input id="menu-search-input" class="menu-search-input" type="text" placeholder="Search menu..." aria-label="Search menu">
                <button id="menu-search-toggle" class="menu-search-toggle" aria-label="Toggle menu search" title="Search menu" aria-expanded="false">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
            </div>
            <ul class="menu" role="menu">
                <!-- Menu will be generated from main-menu.js -->
            </ul>
        </nav>
        <main id="main-content">
            <button id="expand-main" class="expand-main" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                <i class="fas fa-expand expand-icon"></i>
                <i class="fas fa-compress compress-icon" style="display: none;"></i>
            </button>
            <iframe name="content-frame" src="pages/the-planet/about/about.html" style="width: 100%; height: 100%; border: none;"></iframe>
        </main>
    </div>
    <!-- Settings dialog: language, dark/light, font size, color theme -->
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
        <form method="dialog" class="settings-panel">
            <div class="settings-header">
                <h2 id="settings-title" data-i18n="settings">Settings</h2>
                <button class="settings-close" value="close" data-i18n-label="close" aria-label="Close">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>

            <div class="settings-row">
                <span class="settings-label" data-i18n="language">Language</span>
                <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Toggle language" title="Switch language">
                    <span class="lang-option lang-en" title="English">
                        <span class="flag-icon flag-gb"></span>
                    </span>
                    <span class="lang-option lang-vn" title="Tiếng Việt">
                        <span class="flag-icon flag-vn"></span>
                    </span>
                    <span class="lang-slider"></span>
                </button>
            </div>

            <div class="settings-row">
                <span class="settings-label" data-i18n="darkMode">Dark mode</span>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
                    <span class="slider"></span>
                </button>
            </div>

            <fieldset class="settings-group">
                <legend class="settings-label" data-i18n="fontSize">Font size</legend>
                <div class="font-size-options">
                    <label class="font-size-option">
                        <input type="radio" name="font-size" value="default">
                        <span class="font-size-sample sample-default">A</span>
                        <span class="option-caption" data-i18n="sizeDefault">Default</span>
                    </label>
                    <label class="font-size-option">
                        <input type="radio" name="font-size" value="larger">
                        <span class="font-size-sample sample-larger">A</span>
                        <span class="option-caption" data-i18n="sizeLarger">Larger</span>
                    </label>
                    <label class="font-size-option">
                        <input type="radio" name="font-size" value="large">
                        <span class="font-size-sample sample-large">A</span>
                        <span class="option-caption" data-i18n="sizeLarge">Large</span>
                    </label>
                </div>
            </fieldset>

            <fieldset class="settings-group">
                <legend class="settings-label" data-i18n="colorTheme">Color theme</legend>
                <div class="palette-options">
                    <label class="palette-option">
                        <input type="radio" name="palette" value="paper">
                        <span class="palette-swatch" data-palette="paper"></span>
                        <span class="option-caption" data-i18n="palettePaper">Ink and paper</span>
                    </label>
                    <label class="palette-option">
                        <input type="radio" name="palette" value="indigo">
                        <span class="palette-swatch" data-palette="indigo"></span>
                        <span class="option-caption" data-i18n="paletteIndigo">Soft indigo</span>
                    </label>
                    <label class="palette-option">
                        <input type="radio" name="palette" value="sage">
                        <span class="palette-swatch" data-palette="sage"></span>
                        <span class="option-caption" data-i18n="paletteSage">Sage</span>
                    </label>
                    <label class="palette-option">
                        <input type="radio" name="palette" value="clay">
                        <span class="palette-swatch" data-palette="clay"></span>
                        <span class="option-caption" data-i18n="paletteClay">Terracotta</span>
                    </label>
                </div>
            </fieldset>
        </form>
    </dialog>

        <!-- Link to external JavaScript file -->
    <script src="scripts.js"></script>
</body>
</html>
